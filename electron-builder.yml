appId: com.transcriber.app
productName: Transcriber
icon: assets/icon-512.png
directories:
  output: dist

# Gitignored credentials and local research data must not enter the app archive.
files:
  - "main.js"
  - "preload.js"
  - "cli.js"
  - "lib/**"
  - "renderer/**"
  - "assets/**"
  - "docs/**"
  - "README.md"
  - "DEVELOPMENT.md"
  - "CHANGELOG.md"
  - "CLAUDE.md"
  - "CONTRIBUTING.md"
  - "package.json"
  - "LICENSE"
  - "NOTICE"
  - "THIRD-PARTY-LICENSES.json"
  - "!**/.env"
  - "!**/.env.*"
  - "!.agents/**"
  - "!Examples/**"
  - "!.build-whisper/**"

extraResources:
  - from: models/
    to: models/
    filter:
      - "**/*"
  - from: lib/diarize.py
    to: lib/diarize.py
  - from: lib/requirements.txt
    to: lib/requirements.txt
  - from: lib/align.py
    to: lib/align.py
  # align.py imports these siblings by path; Python cannot read inside the asar.
  - from: lib/alignment_models.py
    to: lib/alignment_models.py
  - from: lib/alignment_core.py
    to: lib/alignment_core.py
  # Licence notices for the code adapted in alignment_core.py.
  - from: lib/third_party/whisperx-LICENSE.txt
    to: lib/third_party/whisperx-LICENSE.txt
  - from: lib/third_party/torchaudio-LICENSE.txt
    to: lib/third_party/torchaudio-LICENSE.txt
  - from: lib/requirements-alignment.txt
    to: lib/requirements-alignment.txt
  - from: scripts/setup-diarization.py
    to: scripts/setup-diarization.py
  - from: THIRD-PARTY-LICENSES.json
    to: THIRD-PARTY-LICENSES.json
  - from: "."
    to: "."
    filter:
      - ".debug-build"

win:
  target:
    - nsis
  extraResources:
    - from: bin/win/
      to: bin/win/
      filter:
        - "**/*"

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  artifactName: "${productName}-Setup-${version}.${ext}"

linux:
  target: AppImage
  category: AudioVideo
  extraResources:
    - from: bin/linux/
      to: bin/linux/
      filter:
        - "**/*"

mac:
  target: dmg
  category: public.app-category.utilities
  extraResources:
    - from: bin/mac/
      to: bin/mac/
      filter:
        - "**/*"

publish:
  provider: github
  owner: andrewjamesturner0
  repo: transcriber
