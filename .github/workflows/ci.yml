name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Deterministic tests
        run: npm test
        env:
          TRANSCRIBER_TEST_PYTHON: python

      - name: Electron tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron

      - name: Electron tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron

      - name: Build dry run
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  maths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install CPU tensor dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      - name: Tensor maths tests
        run: npm run test:maths
        env:
          TRANSCRIBER_TEST_PYTHON: python
