name: Dependency Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for dependency updates
        id: check
        run: |
          DEPS="deps.json"
          CHANGES=""

          # --- Check whisper.cpp ---
          CURRENT_WHISPER=$(node -p "require('./$DEPS').whisper.version")
          WHISPER_ASSET=$(node -p "require('./$DEPS').whisper.winCpuAsset")
          LATEST_WHISPER=$(
            curl -fsSL "https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=100" |
            node -e '
              const fs = require("fs");
              const requiredAsset = process.argv[1];
              const releases = JSON.parse(fs.readFileSync(0, "utf8"));
              const versionParts = (tag) => tag.slice(1).split(".").map(Number);
              const candidates = releases.filter((release) =>
                !release.draft &&
                !release.prerelease &&
                /^v\d+\.\d+\.\d+$/.test(release.tag_name) &&
                release.assets.some((asset) => asset.name === requiredAsset)
              );

              candidates.sort((a, b) => {
                const aParts = versionParts(a.tag_name);
                const bParts = versionParts(b.tag_name);
                return bParts[0] - aParts[0] ||
                  bParts[1] - aParts[1] ||
                  bParts[2] - aParts[2];
              });

              if (candidates.length === 0) {
                console.error(`No whisper.cpp release contains ${requiredAsset}`);
                process.exit(1);
              }

              process.stdout.write(candidates[0].tag_name);
            ' "$WHISPER_ASSET"
          )

          if [ "$CURRENT_WHISPER" != "$LATEST_WHISPER" ]; then
            echo "whisper.cpp: $CURRENT_WHISPER -> $LATEST_WHISPER"
            CHANGES="${CHANGES}whisper.cpp: ${CURRENT_WHISPER} -> ${LATEST_WHISPER}\n"
            # Update deps.json
            node -e '
              const fs = require("fs");
              const depsPath = process.argv[1];
              const deps = JSON.parse(fs.readFileSync(depsPath, "utf8"));
              deps.whisper.version = process.argv[2];
              fs.writeFileSync(depsPath, JSON.stringify(deps, null, 2) + "\n");
            ' "$DEPS" "$LATEST_WHISPER"
          fi

          # --- Check ffmpeg (checksum-based) ---
          check_ffmpeg() {
            local key="$1" url="$2"
            local stored_sha=$(node -p "require('./$DEPS').ffmpeg['$key'].sha256")
            local current_sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

            if [ -n "$stored_sha" ] && [ "$stored_sha" != "$current_sha" ]; then
              echo "ffmpeg ($key): checksum changed"
              CHANGES="${CHANGES}ffmpeg ($key): checksum changed (binary updated upstream)\n"
            fi

            # Always update the stored checksum
            node -e "
              const fs = require('fs');
              const deps = JSON.parse(fs.readFileSync('$DEPS', 'utf8'));
              deps.ffmpeg['$key'].sha256 = '$current_sha';
              fs.writeFileSync('$DEPS', JSON.stringify(deps, null, 2) + '\n');
            "
          }

          FFMPEG_WIN_URL=$(node -p "require('./$DEPS').ffmpeg.win.url")
          FFMPEG_AMD64_URL=$(node -p "require('./$DEPS').ffmpeg['linux-amd64'].url")
          FFMPEG_ARM64_URL=$(node -p "require('./$DEPS').ffmpeg['linux-arm64'].url")

          check_ffmpeg "win" "$FFMPEG_WIN_URL"
          check_ffmpeg "linux-amd64" "$FFMPEG_AMD64_URL"
          check_ffmpeg "linux-arm64" "$FFMPEG_ARM64_URL"

          # --- Check Electron ---
          CURRENT_ELECTRON=$(node -p "require('./$DEPS').electron.version")
          LATEST_ELECTRON=$(curl -fsSL "https://api.github.com/repos/electron/electron/releases/latest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name.replace(/^v/, '')")

          if ! [[ "$LATEST_ELECTRON" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Electron version: $LATEST_ELECTRON" >&2
            exit 1
          fi

          if [ "$CURRENT_ELECTRON" != "$LATEST_ELECTRON" ]; then
            echo "electron: $CURRENT_ELECTRON -> $LATEST_ELECTRON"
            CHANGES="${CHANGES}electron: ${CURRENT_ELECTRON} -> ${LATEST_ELECTRON}\n"
            node -e '
              const fs = require("fs");
              const depsPath = process.argv[1];
              const deps = JSON.parse(fs.readFileSync(depsPath, "utf8"));
              deps.electron.version = process.argv[2];
              fs.writeFileSync(depsPath, JSON.stringify(deps, null, 2) + "\n");
            ' "$DEPS" "$LATEST_ELECTRON"
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.devDependencies.electron = `^${process.argv[1]}`;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            ' "$LATEST_ELECTRON"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

          # --- Output results ---
          if [ -n "$CHANGES" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            # Multiline output
            {
              echo "summary<<EOF"
              echo -e "$CHANGES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.check.outputs.has_updates == 'true'
        run: |
          BRANCH="deps/auto-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add deps.json package.json package-lock.json
          git commit -m "deps: update dependency versions

          ${{ steps.check.outputs.summary }}

          Auto-generated by dep-check workflow."
          git push -u origin "$BRANCH"

          gh pr create \
            --title "deps: update dependency versions" \
            --body "$(cat <<'EOF'
          ## Dependency Updates

          ${{ steps.check.outputs.summary }}

          This PR was auto-generated by the weekly dependency check workflow.

          **Next steps:**
          1. Review the changes in `deps.json`
          2. Merge to trigger a release build
          3. Test the built artifacts before publishing
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update checksums (no version changes)
        if: steps.check.outputs.has_updates == 'false'
        run: |
          # If only checksums were updated (first run or no changes), commit directly
          if ! git diff --quiet deps.json package.json package-lock.json; then
            git add deps.json package.json package-lock.json
            git commit -m "deps: update ffmpeg checksums (no version changes)"
            git push
          else
            echo "No changes detected."
          fi
